[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zk-mcp"
version = "0.1.0"
description = "MCP server for zk plain text note-taking system integration"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "koei-kaji", email = "koei.kaji@gmail.com" }
]
dependencies = [
    "injector>=0.22.0",
    "mcp[cli]>=1.6.0",
    "pydantic-settings>=2.8.1",
]

[project.urls]
Homepage = "https://github.com/koei-kaji/zk-mcp"
Repository = "https://github.com/koei-kaji/zk-mcp"

[project.scripts]
zk-mcp = "src.zk_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.3.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zk_mcp"]
